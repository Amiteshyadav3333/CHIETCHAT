name: CHEETCHAT quality gates

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-clone/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signal-clone/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-clone/backend
    env:
      DATABASE_URL: sqlite:///:memory:
      SECRET_KEY: ci-secret-key-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-characters
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: signal-clone/backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest tests -q
