services:
  - type: cron
    name: chietchat-scheduled-delivery
    env: python
    region: oregon
    rootDir: signal-clone
    schedule: "* * * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/deliver_scheduled_messages.py --limit 250
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chietchat-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FRONTEND_URL
        value: https://chat.indiasearch.site
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CALL_RECORD_RETENTION_DAYS
        value: "90"
      - key: AI_MEMORY_RETENTION_DAYS
        value: "30"
      - key: AI_MEMORY_MAX_ROWS
        value: "100"
  - type: web
    name: chietchat
    env: python
    region: oregon
    rootDir: signal-clone
    buildCommand: ./render-build.sh
    preDeployCommand: python backend/migrate.py
    startCommand: gunicorn -w 1 --threads 100 --timeout 120 --chdir backend wsgi:app
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: chietchat-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://chat.indiasearch.site
      - key: BACKEND_URL
        value: https://chietchat.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: BACKUP_SIGNING_KEY
        sync: false
      - key: DATA_RETENTION_PEPPER
        sync: false
      - key: PAYMENT_RETENTION_DAYS
        value: "2555"
      - key: CALL_RECORD_RETENTION_DAYS
        value: "90"
      - key: AI_MEMORY_RETENTION_DAYS
        value: "30"
      - key: AI_MEMORY_MAX_ROWS
        value: "100"
      - key: APP_ENV
        value: production
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
