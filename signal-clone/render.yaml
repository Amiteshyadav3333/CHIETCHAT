services:
  - type: cron
    name: chietchat-scheduled-delivery
    runtime: python
    region: singapore
    rootDir: .
    schedule: "* * * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/deliver_scheduled_messages.py --limit 250
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FRONTEND_URL
        value: https://chat.indiasearch.site
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CALL_RECORD_RETENTION_DAYS
        value: "90"
      - key: AI_MEMORY_RETENTION_DAYS
        value: "30"
      - key: AI_MEMORY_MAX_ROWS
        value: "100"
  - type: web
    name: chietchat-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python backend/migrate.py
    startCommand: gunicorn -w 1 --threads 100 --timeout 120 --chdir backend wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Configure at least one AI provider in the Render dashboard. The backend
      # automatically falls back through the others when more than one is set.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://chat.indiasearch.site
      - key: BACKEND_URL
        value: https://chietchat-backend.onrender.com
      - key: PODLIVE_URL
        value: https://podlive-sigma.vercel.app
      - key: PODLIVE_SSO_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: BACKUP_SIGNING_KEY
        sync: false
      - key: DATA_RETENTION_PEPPER
        sync: false
      - key: PAYMENT_RETENTION_DAYS
        value: "2555"
      - key: CALL_RECORD_RETENTION_DAYS
        value: "90"
      - key: AI_MEMORY_RETENTION_DAYS
        value: "30"
      - key: AI_MEMORY_MAX_ROWS
        value: "100"
      - key: APP_ENV
        value: production
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: cron
    name: chietchat-retention-cleanup
    runtime: python
    region: singapore
    rootDir: .
    schedule: "*/10 * * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/cleanup_retention.py --limit 1000 --confirm
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYMENT_RETENTION_DAYS
        value: "2555"
